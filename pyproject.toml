[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-triage"
version = "0.1.0"
description = "Sort tracker issues by whether a pull request alone can resolve them, with typed model judgments and policy in code."
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []

[project.scripts]
ticket-triage = "ticket_triage.triage:main"
ticket-label = "ticket_triage.label:main"

[tool.setuptools]
packages = ["ticket_triage"]
